[package]
name = "bach"
version = "0.1.0"
edition = "2024"
authors = ["Marco Elver <me@marcoelver.com>"]
license = "Apache-2.0"
description = "Evolutionary MIDI generation library"

[dependencies]
rand = "0.9.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
signal-hook = "0.3.17"

# Build smaller binaries in release mode.
[profile.release]
lto = true
opt-level = "z"
strip = true  # largest size reduction
